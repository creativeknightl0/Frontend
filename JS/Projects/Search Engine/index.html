<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine For Every Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <nav>
            <div class="header">Every Search</div>
        </nav>
        <main>
            <div class="inpAndBtn">
                <label for="searchInp">Search</label>
                <input type="text" name="Search" id="searchInp" placeholder="Somethin...">
                <button id="searchBtn">Search</button>
            </div>
            <div class="results">
                <div class="searchResults">
                    <div>Search Results:</div>
                    <ul id="list2"></ul>
                </div>
                <div class="searchHistory">
                    <div>History:</div>
                    <ul id="list"></ul>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
