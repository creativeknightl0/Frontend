    <h2>Seach hijacking</h2>
    <h3>Search Reddit</h3>
    <form action="https://www.reddit.com/search">
        <input type="text" name="q">
        <button>Search Reddit</button>
    </form>    
    <h3>Search Google</h3>
    <form action="https://www.google.com/search">
        <input type="text" name="q">
        <button>Search Google</button>
    </form>
    <h3>Search Youtube</h3>
    <form action="https://www.youtube.com/results">
        <input type="text" name="search_query">
        <button>Search Youtube</button>
    </form>

    <h2>More Inputs!</h2>
    <form action="/birds">
        <input type="checkbox" name="agree_tos" id="agree" checked>
        <label for="agree">I agree to everything</label>
        
        <p>
            
            <label for="xs">XS</label>
            <input type="radio" name="size" id="xs" value="xs">
            <label for="s">S</label>
            <input type="radio" name="size" id="s" value="s">
            <label for="l">L</label>
            <input type="radio" name="size" id="l" value="l">
        </p>
        <p>
            <label for="bowl">Please select the type of bowl</label>
            <select name="bowl" id="bowl">
                <option value="">--Please select an option--</option>
                <option value="dukes" >Duke</option>
                <option value="kashmir">Kookaburra</option>
                <option value="SG">SG</option>

            </select>
        </p>
        <p>
            <label for="visibility">Visibility at Night</label>
            <input type="range" id="visibility" name="visible" value="1" min="1" max="100">
        </p>
        <p>
            <label for="requests">Any special requests?</label>
            <br>
            <textarea name="Requests?" id="requests" rows="10" cols="40" placeholder="Type something here"></textarea>
        </p>
        <button>Submit</button>
    </form>

    <h2>Validation demo</h2>
    <form action="/dummy">
        <label for="first">Enter first name</label>
        <input type="text" name="first" id="first" required>
        <p>
            <label for="username">username</label>
            <input type="text" name="username" id="username" minlength="5" maxlength="20" required>
        </p>
        <p>
            <!--<input type="email" required>-->
            <input type="url" required>
        </p>
        <button>Submit</button>
    </form>

</body>
</html>
