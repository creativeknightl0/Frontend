<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Race Registration!</h1>
    <form action="/race">
        <div>
            <label for="fn">First Name</label>
            <input type="text" name="firstname" id="fn" required>
            <label for="ls">Last Name</label>
            <input type="text" name="lastname" id="ls" required>
        </div>

        <p>Select a Race:</p>
        <div>
            
            <input type="radio" name="Run" id="funrun" value="funrun">
            <label for="funrun">Fun Run 5K</label>
        </div>
        <div>
            
            
            
            <input type="radio" name="Run" id="half" value="half">
            <label for="half">Half Marathon</label>
        </div>
        <div>
            
            <input type="radio" name="Run" id="full" value="full">
            <label for="full">Full Marathon</label>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required> 
        </div>

        <div>
            <label for="age">Select Age Group</label>
            <select name="age" id="age">
                <option value="">--Select an option--</option>
                <option value="kids">under 18</option>
                <option value="ya">18-30</option>
                <option value="adults">30-55</option>
                <option value="seniors">55 above</option>
            </select>
        </div>
        <button>Register!</button>
        
    </form>
    
</body>
</html>
