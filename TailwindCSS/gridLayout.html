<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="grid grid-cols-2">
        <div class="bg-yellow-500 border col-span-3 px-4 py-2">
            A
        </div>
        <div class="bg-purple-500 border h-screen px-4 py-2">
            B
        </div>
        <div class="bg-blue-500 border col-span-1 h-screen px-4 py-2">
            C
        </div>
    </div>
</body>
</html>
