<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex flex-col gap-2 p-8 shadow-lg outline outline-black/5 mx-10 my-10 max-w-sm rounded-xl sm:flex-row sm:items-center sm:gap-6 sm:py-4">
        <img class="mx-auto block h-24 rounded-full sm:mx-0 sm:shrink-0" src="../pics/erin-lindford.jpg" alt="Erin Lindford Image"/>
        <div class="space-y-2 text-center sm:text-left">
            <div class="space-y-0.5">
                <p class="text-lg font-semibold text-black">Erin Lindford</p>
                <p class="font-medium text-gray-500">Product Engineer</p>
            </div>
            <button class="border-purple-200 text-purple-600 px-4 py-1 text-sm font-semibold outline rounded-full hover:border-transparent hover:bg-purple-600 hover:text-white active:bg-purple-700">
                Message
            </button>
        </div>
    </div>
</body>
</html>
